<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger — parser tests</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 1.5rem; max-width: 46rem; }
    h1 { font-size: 1.2rem; }
    li { margin: .2rem 0; }
    .ok::before { content: "ok "; color: #2b7a3d; font-weight: 600; }
    .fail { color: #8a1c1c; }
    .fail::before { content: "FAIL "; font-weight: 600; }
    .msg { display: block; margin-left: 1.5rem; font-family: ui-monospace, monospace; font-size: .85em; }
    #summary { font-weight: 600; margin-top: 1rem; }
    .note { color: #555; font-size: .9em; }
  </style>
</head>
<body>
  <h1>Ledger — plan parser tests</h1>
  <p class="note">
    Open this page through a local web server, not as a <code>file://</code> URL — it fetches
    <code>plans/starter.md</code>, and browsers block that over <code>file://</code>.
    From the repo root: <code>python3 -m http.server 8000</code>, then visit
    <code>http://localhost:8000/tests/</code>.
  </p>
  <ul id="results"></ul>
  <p id="summary"></p>

  <script type="module">
    import { runSuite } from './suite.js';

    const list = document.getElementById('results');
    const summary = document.getElementById('summary');

    try {
      const starter = await (await fetch('../plans/starter.md')).text();
      const results = runSuite(starter);
      let failed = 0;
      for (const r of results) {
        const li = document.createElement('li');
        li.className = r.ok ? 'ok' : 'fail';
        li.textContent = r.name;
        if (!r.ok) {
          failed++;
          const msg = document.createElement('span');
          msg.className = 'msg';
          msg.textContent = r.message;
          li.appendChild(msg);
        }
        list.appendChild(li);
      }
      summary.textContent = `${results.length - failed}/${results.length} passed`;
    } catch (e) {
      summary.textContent = `Could not run: ${e.message}`;
    }
  </script>
</body>
</html>
